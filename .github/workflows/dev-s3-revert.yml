name: dev-ohc-care-fe-s3-revert

# Manual rollback: promote a previously-archived release (s3://<bucket>/ohc-care-fe/<tag>/)
# back onto the live channel (.../ohc-care-fe/main/), then invalidate CloudFront.
# Modelled on eka-care/elixir *-s3-revert.yaml. Dev-only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Archived tag to revert to (e.g. dev-0.0.1) — must already exist under ohc-care-fe/<tag>/'
        required: true
        default: ''

env:
  BUCKET_LOCATION: ""                                 # TODO(devops): same bucket as dev-s3-deploy.yml
  S3_BASE: ohc-care-fe
  DISTRIBUTION_ID: ""                                 # TODO(devops): same distribution as dev-s3-deploy.yml

jobs:
  revert:
    runs-on: dev-runner-server
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Tag format check
        env:
          IMAGE_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "$IMAGE_TAG" == dev-* ]]; then
            echo "tag ok: $IMAGE_TAG"
          else
            echo "please provide a dev-* tag"; exit 1
          fi

      - name: IAM role for the GitHub runner
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::607765814920:role/github-runner-role
          role-session-name: runner-role
          aws-region: ${{ secrets.DEV_AWS_Region }}

      - name: Verify archive exists
        env:
          IMAGE_TAG: ${{ github.event.inputs.tag }}
        run: |
          ARCHIVE="s3://${BUCKET_LOCATION}/${S3_BASE}/${IMAGE_TAG}"
          if ! aws s3 ls "$ARCHIVE/index.html" >/dev/null 2>&1; then
            echo "❌ No archive at $ARCHIVE — nothing to revert to"; exit 1
          fi
          echo "✅ Found archive $ARCHIVE"

      - name: Promote archive to live
        env:
          IMAGE_TAG: ${{ github.event.inputs.tag }}
        run: |
          ARCHIVE="s3://${BUCKET_LOCATION}/${S3_BASE}/${IMAGE_TAG}"
          LIVE="s3://${BUCKET_LOCATION}/${S3_BASE}/main"
          aws s3 sync "$ARCHIVE/" "$LIVE/" --cache-control "public,max-age=31536000,immutable" --exclude "*.html"
          aws s3 cp "$ARCHIVE/index.html" "$LIVE/index.html" \
            --cache-control "no-cache, must-revalidate" --content-type "text/html"
          echo "Reverted live → ${IMAGE_TAG}"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/${S3_BASE}/main/*"
