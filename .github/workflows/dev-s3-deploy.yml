name: dev-ohc-care-fe-s3-deploy

# Static dev deploy: build the Vite SPA and sync to S3 (existing bucket, new prefix),
# then invalidate CloudFront. Modelled on eka-care/elixir dev-*-s3-deploy workflows.
# Dev-only, POC.

on:
  push:
    tags:
      - dev-*

env:
  # TODO(devops): existing dev bucket to reuse, and the prefix for this app
  BUCKET_LOCATION: REPLACE_WITH_EXISTING_DEV_BUCKET   # e.g. m-dev-elixir-... (no s3:// prefix)
  S3_PREFIX: ohc-care-fe/main                         # new prefix inside the shared bucket (elixir uses <app>/main)
  # TODO(devops): CloudFront distribution that fronts the above bucket
  DISTRIBUTION_ID: REPLACE_WITH_DISTRIBUTION_ID       # e.g. E258O583I1XMM5

jobs:
  build-react:
    runs-on: dev-runner-server
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: echo "VERSION=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_OUTPUT

      - name: IAM role for the GitHub runner
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::607765814920:role/github-runner-role
          role-session-name: runner-role
          aws-region: ${{ secrets.DEV_AWS_Region }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: |
          npm ci --ignore-scripts
          npm run postinstall

      - name: Build
        env:
          CI: "false"        # vite/CRA: don't treat warnings as errors (matches netlify.toml)
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          npm run build
          ls -la build

      - name: Sync to S3
        env:
          IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          DEST="s3://${BUCKET_LOCATION}/${S3_PREFIX}"
          # Hashed, immutable assets — long cache. --delete prunes stale files under the prefix.
          aws s3 sync build/ "$DEST" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html"
          # index.html / html — never cache (SPA entrypoint must always be fresh).
          aws s3 sync build/ "$DEST" \
            --cache-control "no-cache, must-revalidate" \
            --exclude "*" --include "*.html"
          echo "Deployed ${IMAGE_TAG} to ${DEST}"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/${S3_PREFIX}/*"
