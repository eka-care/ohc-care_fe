name: dev-ohc-care-fe-s3-deploy

# Static dev deploy: build the Vite SPA and sync to S3 (existing bucket, new prefix),
# then invalidate CloudFront. Modelled on eka-care/elixir dev-*-s3-deploy workflows.
# Dev-only, POC.

on:
  push:
    tags:
      - dev-*

env:
  # TODO(devops): existing dev bucket to reuse, and the prefix for this app
  BUCKET_LOCATION: ""                                 # TODO(devops): elixir dev bucket for this app (elixir uses per-app buckets, e.g. elixir-dev-*); no s3:// prefix
  S3_BASE: ohc-care-fe                                # base prefix in the bucket; channels: main (live) + <tag> (archives)
  DISTRIBUTION_ID: ""                                 # TODO(devops): fill after CloudFront is created

jobs:
  build-react:
    runs-on: dev-runner-server
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: echo "VERSION=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_OUTPUT

      - name: IAM role for the GitHub runner
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::607765814920:role/github-runner-role
          role-session-name: runner-role
          aws-region: ${{ secrets.DEV_AWS_Region }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: |
          npm ci --ignore-scripts
          npm run postinstall

      - name: Build
        env:
          CI: "false"        # vite/CRA: don't treat warnings as errors (matches netlify.toml)
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          npm run build
          ls -la build

      - name: Sync to S3 (archive + live)
        env:
          IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          ARCHIVE="s3://${BUCKET_LOCATION}/${S3_BASE}/${IMAGE_TAG}"
          LIVE="s3://${BUCKET_LOCATION}/${S3_BASE}/main"
          # 1. Immutable per-release archive — never overwritten, the revert source. NO --delete.
          aws s3 sync build/ "$ARCHIVE" --cache-control "public,max-age=31536000,immutable"
          # 2. Live channel — NO --delete (keeps old hashed assets so previous releases remain revertable).
          aws s3 sync build/ "$LIVE" --cache-control "public,max-age=31536000,immutable" --exclude "*.html"
          # 3. index.html on live must never be cached (SPA entrypoint).
          aws s3 cp build/index.html "$LIVE/index.html" \
            --cache-control "no-cache, must-revalidate" --content-type "text/html"
          echo "Archived ${IMAGE_TAG} → ${ARCHIVE}; promoted to ${LIVE}"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/${S3_BASE}/main/*"
